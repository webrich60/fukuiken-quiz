        }
        @keyframes fadeIn {

        }

            animation: fadeIn 0.4s ease-out forwards;
        }
        
        /* ◯❌マークのアニメーション */

            0% { transform: scale(0.3); opacity: 0; }

            100% { transform: scale(1.5); opacity: 0; }

            animation: markPop 1s ease-out forwards;

        /* ご当地キャラひょっこりアニメーション1 */

            animation: rightPop 7s ease-in-out infinite;

            0%, 40%, 100% { transform: translate(-100%, 100%) rotate(-20deg); }

            animation: leftPop 9s ease-in-out infinite;

        // サウンド再生の準備（Web Audio API）
        let audioCtx;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                gain.gain.value = 0;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.01);
                isAudioInitialized = true;
            } catch (e) {
                console.log("Web Audio API not supported");
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // ピンポン♪（正解音）
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                oscillator.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.1); // C6
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } else {
                // ブッブー（不正解音）
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(120, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

            { id: 'g7', category: 'グルメ', question: '越前市（武生）周辺の食堂などで提供されている、ラーメンのスープに蕎麦つゆの“かえし”を使っている麺料理は何でしょう？', options: ['たけふ駅前中華そば', '敦賀ラーメン', '越前ラーメン', '武生そば'], answer: 'たけふ駅前中華そば', explanation: '蕎麦屋さん発祥のラーメンで、和風だしの効いた透き通ったスープが特徴。地元で長く愛されているソウルフードです。' },
            { id: 'g8', category: 'グルメ', question: '福井県で「カツ丼」と注文すると一般的に出てくる、ウスターソースベースのタレにくぐらせたカツがのった丼は何でしょう？', options: ['ソースカツ丼', '醤油カツ丼', '卵とじカツ丼', '味噌カツ丼'], answer: 'ソースカツ丼', explanation: '福井でカツ丼といえばソースカツ丼。薄切りの豚肉をきめ細かいパン粉でカラッと揚げ、熱々のうちに特製ソースにくぐらせてご飯に乗せます。' },
            { id: 'g9', category: 'グルメ', question: 'ソースカツ丼の発祥のお店とされ、福井県内で愛されている老舗洋食店の名前は何でしょう？', options: ['ヨーロッパ軒', 'アメリカ軒', 'アジア軒', 'ロシア軒'], answer: 'ヨーロッパ軒', explanation: '大正2年創業の老舗。創業者である高畠増太郎がドイツでの料理修業を経て考案したと言われており、福井県内に多数ののれん分け店があります。' },
            { id: 'g10', category: 'グルメ', question: '越前市（武生）のご当地グルメで、オムライスの上にトンカツをのせ、デミグラスソースなどをかけた料理は何でしょう？', options: ['ボルガライス', 'ハヤシライス', 'オムカツ', 'サバエドッグ'], answer: 'ボルガライス', explanation: 'オムライスの上にカツを乗せ、お店独自のソース（デミグラスやトマトベースなど）をかけたボリューム満点の料理。名前の由来はロシアのボルガ川など諸説あります。' },

            // 観光
            { id: 't1', category: '観光', question: '北陸最大級のドームプラネタリウムや大型の恐竜遊具がある、坂井市の児童科学館の愛称は何でしょう？', options: ['エンゼルランドふくい', 'サイエンスヒルズこまつ', 'こども家族館', 'ワンダーランド'], answer: 'エンゼルランドふくい', explanation: '正式名称は「福井県児童科学館」。宇宙飛行士の毛利衛さんが名誉館長を務めており、屋内外で一日中遊べる施設です。' },
            { id: 't2', category: '観光', question: 'ツツジの名所として知られ、レッサーパンダがいる動物園も併設されている鯖江市の公園はどこでしょう？', options: ['西山公園', '足羽山公園', 'きのこの森', '芝政ワールド'], answer: '西山公園', explanation: '約5万株のつつじが咲き誇る名所。併設の西山動物園はレッサーパンダの繁殖で全国的に有名で、しかも無料で入園できます。' },
            { id: 't3', category: '観光', question: '約7万年の歴史を測ることができる「年縞（てんこう）」を展示している若狭町の博物館はどこでしょう？', options: ['年縞博物館', '恐竜博物館', '歴史博物館', '海浜自然センター'], answer: '年縞博物館', explanation: '三方五湖の一つ「水月湖」の湖底に7万年にわたって奇跡的に積もった縞模様の地層「年縞」を展示しており、世界の年代測定の標準（ものさし）となっています。' },
            { id: 't4', category: '観光', question: '春には約1万1000株のアジサイが咲き誇り、遊園地や動物園もある福井市中心部の公園はどこでしょう？', options: ['足羽山公園', '西山公園', '霞ヶ城公園', 'ゆりの里公園'], answer: '足羽山公園', explanation: '春には桜やアジサイが美しく、アスレチックやミニ動物園もある市民の憩いの場。山上には継体天皇像も建っています。' },
            { id: 't5', category: '観光', question: '日本海に突き出た岩場で、夕日の絶景スポットとしても知られる福井市の海岸景勝地はどこでしょう？', options: ['鉾島', '東尋坊', '呼鳥門', '越前岬'], answer: '鉾島', explanation: '柱状節理の岩場が日本海に突き出た高さ約50mの小島で、遊歩道が整備されており頂上の松の木まで登ることができます。' },
            { id: 't6', category: '観光', question: '恐竜の化石発掘で知られ、世界有数規模を誇る勝山市の博物館はどこでしょう？', options: ['福井県立恐竜博物館', '年縞博物館', '越前がにミュージアム', '海浜自然センター'], answer: '福井県立恐竜博物館', explanation: '勝山市は日本最大の恐竜化石発掘地。博物館は銀色の卵のようなドーム型の外観が特徴的で、50体以上の恐竜骨格が展示されています。' },
            { id: 't7', category: '観光', question: '柱状節理の断崖絶壁が約1km続く、坂井市を代表する景勝地はどこでしょう？', options: ['東尋坊', '鉾島', '越前岬', '呼鳥門'], answer: '東尋坊', explanation: '世界に3カ所しかないと言われる大規模な輝石安山岩の柱状節理の絶壁が続きます。サスペンスドラマのロケ地としても有名です。' },
            { id: 't8', category: '観光', question: '1244年に道元禅師によって開かれた曹洞宗の大本山で、多くの修行僧が修行に励む寺院はどこでしょう？', options: ['大本山永平寺', '氣比神宮', '劔神社', '白山平泉寺'], answer: '大本山永平寺', explanation: '道元禅師が開創した曹洞宗の厳しい修行道場。現在も多くの雲水（修行僧）が日夜修行に励んでおり、荘厳な空気が漂います。' },
            { id: 't9', category: '観光', question: '三方五湖や若狭湾を360度のパノラマビューで楽しめる山頂の公園はどこでしょう？', options: ['レインボーライン山頂公園', '西山公園', '足羽山公園', '東尋坊タワー'], answer: 'レインボーライン山頂公園', explanation: 'リフトやケーブルカーで登る山頂からは、水質の違いから色が異なる三方五湖と若狭湾の絶景を一度に楽しむことができます。' },
            { id: 't10', category: '観光', question: 'イルカショーやペンギンの散歩が楽しめ、「みて、ふれて、楽しく学べる」がテーマの坂井市の水族館はどこでしょう？', options: ['越前松島水族館', 'くにみクラゲ公民館', 'のとじま水族館', '越前がにミュージアム'], answer: '越前松島水族館', explanation: '体験・体感型の水族館。海の生き物に直接触れたり、ガラス張りの床の上に乗れる「さんごの海」水槽がSNS等で人気です。' },

            // 歴史
            { id: 'h1', category: '歴史', question: '越前藩主松平家の別邸であった、福井市にある名勝指定の庭園はどこでしょう？', options: ['名勝 養浩館庭園', '兼六園', '後楽園', '玄宮園'], answer: '名勝 養浩館庭園', explanation: '江戸時代初期の回遊式林泉庭園で、かつては「御泉水屋敷」と呼ばれていました。アメリカの日本庭園ランキングでも常に上位に入ります。' },
            { id: 'h2', category: '歴史', question: '日本三大木造大鳥居を擁し、北陸道総鎮守として知られる敦賀市の神社はどこでしょう？', options: ['氣比神宮', '劔神社', '白山平泉寺', '神明神社'], answer: '氣比神宮', explanation: '地元では「けひさん」として親しまれ、高さ10.9mの大鳥居は春日大社、厳島神社と並ぶ日本三大木造大鳥居の一つです。' },
            { id: 'h3', category: '歴史', question: '戦国時代、織田信長に滅ぼされるまで約100年間にわたり越前を支配した戦国大名の城下町跡は何でしょう？', options: ['一乗谷朝倉氏遺跡', '丸岡城', '北ノ庄城', '大野城'], answer: '一乗谷朝倉氏遺跡', explanation: '戦国大名朝倉氏の城下町跡。発掘調査により町並みが復原されており、国の特別史跡・特別名勝・重要文化財の三重指定を受けています。' },
            { id: 'h4', category: '歴史', question: '現存する日本最古の天守閣を持つとされる、坂井市にあるお城はどこでしょう？', options: ['丸岡城', '彦根城', '犬山城', '松本城'], answer: '丸岡城', explanation: '全国に12しかない現存天守の一つ。屋根には寒冷地特有の笏谷石（しゃくだにいし）で作られた石瓦が葺かれている珍しいお城です。' },
            { id: 'h5', category: '歴史', question: '福井という地名の由来となったとされる「福の井」という井戸が残る城跡はどこでしょう？', options: ['福井城跡', '北ノ庄城跡', '大野城跡', '丸岡城跡'], answer: '福井城跡', explanation: '初代福井藩主の結城秀康によって築かれました。「福の井」は県庁の敷地内となっている城跡の天守台のそばに現在も残っています。' },
            { id: 'h6', category: '歴史', question: '織田信長の命により越前国を平定した後、北庄に城と城下町を築き、現在の福井市の基礎を作った武将は誰でしょう？', options: ['柴田勝家', '織田信長', '朝倉義景', '結城秀康'], answer: '柴田勝家', explanation: '織田信長の筆頭家老で、お市の方を正室に迎えました。彼が築いた北ノ庄城は9層の壮大な天守があったと伝えられています。' },
            { id: 'h7', category: '歴史', question: '大野市の象徴であり、雲海に包まれて浮かんで見えることから「天空の城」と呼ばれる城はどこでしょう？', options: ['越前大野城', '丸岡城', '北ノ庄城', '敦賀城'], answer: '越前大野城', explanation: '大野盆地にある亀山（標高約249m）に築かれた城で、秋から春にかけての早朝、条件が揃うと雲海に浮かぶ幻想的な姿が見られます。' },
            { id: 'h8', category: '歴史', question: '若狭と京都を結び、海産物や様々な物資、文化を運んだ街道群は、運ばれた代表的な魚の名前から何と呼ばれているでしょう？', options: ['鯖街道', '塩街道', '絹街道', '北陸道'], answer: '鯖街道', explanation: '若狭湾の海産物を京都に運んだ道。特に「鯖」が塩漬けにされて大量に運ばれたことからこの名が付き、京の食文化を支えました。' },
            { id: 'h9', category: '歴史', question: '1180年頃に現在の越前町小曽原で生産が始まったとされ、日本六古窯の一つにも数えられる焼き物は何でしょう？', options: ['越前焼', '九谷焼', '珠洲焼', '備前焼'], answer: '越前焼', explanation: '平安時代末期から続く焼き物で、釉薬を使わず高温で焼き締めることで、土に含まれる鉄分が表面に溶け出す素朴な風合いが特徴です。' },
            { id: 'h10', category: '歴史', question: '幕末の福井藩第16代藩主で、藩政改革を行い、明治維新に大きな影響を与えた名君は誰でしょう？', options: ['松平春嶽', '橋本左内', '由利公正', '結城秀康'], answer: '松平春嶽', explanation: '幕末の四賢侯の一人。橋本左内や由利公正らを登用して藩政改革を行い、将軍継嗣問題など幕末の政局で極めて重要な役割を果たしました。' },

            // 方言
            { id: 'd1', category: '方言', question: '福井弁で「テレビの画面が乱れている状態」を何と言うでしょう？', options: ['じゃみじゃみ', 'ちかちか', 'ざらざら', 'ばちばち'], answer: 'じゃみじゃみ', explanation: 'アナログテレビ時代の砂嵐画面のこと。「今日のテレビ、じゃみじゃみやの〜」のように使います。' },
            { id: 'd2', category: '方言', question: '「正座しなさい」という意味で、子供のしつけなどでよく使われる愛らしい響きの福井弁は何でしょう？', options: ['おちょきん', 'おちゃんこ', 'おすわり', 'おちんちん'], answer: 'おちょきん', explanation: '保育園や学校の先生が「はい、みんなおちょきんして！」とよく使います。県民には馴染み深い言葉です。' },
            { id: 'd3', category: '方言', question: 'コップなどに水が溢れそうなほどギリギリまで入っている状態を、福井弁で何と言うでしょう？', options: ['つるつるいっぱい', 'なみなみ', 'ぎりぎりいっぱい', 'すれすれ'], answer: 'つるつるいっぱい', explanation: '表面張力ギリギリまで水が入っている様子。福井県民はこれを標準語だと信じて疑わないことが多いです。' },
            { id: 'd4', category: '方言', question: '「そうそう」「その通り」と相槌を打つ時によく使われる福井弁の言葉は何でしょう？', options: ['ほやほや', 'んだんだ', 'だらだら', 'せやせや'], answer: 'ほやほや', explanation: '「そうそう」という同意の相槌。福井弁を代表する言葉の一つで、連続して「ほやほやほや」と言うこともあります。' },
            { id: 'd5', category: '方言', question: '「とても」「すごく」という意味で、「〇〇おいしい」のように強調する際に使われる福井弁は何でしょう？', options: ['ひっで', 'でれっ', 'ばり', 'ぶち'], answer: 'ひっで', explanation: '「とても」「ひどく」という意味。「ひっでおいしい（すごくおいしい）」「ひっで疲れた」のように強調として使います。' },
            { id: 'd6', category: '方言', question: '「早くしなさい」という意味ですが、他県の人が聞くと「早く死んで」と勘違いして驚いてしまう福井弁は何でしょう？', options: ['はよしね', 'はよきて', 'はよして', 'はよかえれ'], answer: 'はよしね', explanation: '「しね」は「する」の命令形「せよ」が変化したもので、決して悪口ではありませんが、他県の人はギョッとします。' },
            { id: 'd7', category: '方言', question: '「疲れた」という意味で使われますが、標準語の「安心する」とは意味が異なる福井弁は何でしょう？', options: ['ほっこりする', 'しなーっと', 'てきねえ', 'おもっしぇえ'], answer: 'ほっこりする', explanation: '福井では「あー、疲れた（しんどい）」という意味で、一仕事終えた後などに「ほっこりしたわー」と使います。' },
            { id: 'd8', category: '方言', question: '「いない」という意味の福井弁で、塩のことではない言葉は何でしょう？', options: ['えん', 'おらん', 'こん', 'みん'], answer: 'えん', explanation: '「（人が）いない」のこと。有名な福井弁の早口言葉に「だんね、えん、こん（構わない、いない、来ない）」があります。' },
            { id: 'd9', category: '方言', question: '「ひどく散らかって収集がつかない状態」や「めちゃくちゃ」を意味する福井弁は何でしょう？', options: ['わやくそ', 'じゃみじゃみ', 'てきねえ', 'だわもん'], answer: 'わやくそ', explanation: '「めちゃくちゃ」「収集がつかない」状態。「部屋がわやくそや〜」「仕事がわやくそになった」のように使います。' },
            { id: 'd10', category: '方言', question: '「私」「俺」と自分を指す一人称で、福井弁で男性がよく使う言葉は何でしょう？', options: ['うら', 'わい', 'おどん', 'おら'], answer: 'うら', explanation: '男性が使う一人称「俺」。複数形になると「うらら（俺たち）」になります。' },

            // イベント
            { id: 'f1', category: 'イベント', question: '毎年5月に開催され、巨大な武者人形の山車が町を練り歩く坂井市のお祭りは何でしょう？', options: ['三国祭', '敦賀まつり', '勝山左義長', 'おおの城まつり'], answer: '三国祭', explanation: '北陸三大祭りの一つ。高さ約6.5mの巨大な武者人形の山車（やま）が、狭い湊町の路地をギリギリで練り歩く迫力は圧巻です。' },
            { id: 'f2', category: 'イベント', question: '毎年3月2日に行われ、奈良の東大寺二月堂へ香水を送る神事として知られる小浜市のお祭りは何でしょう？', options: ['お水送り', 'お水取り', '蓮如忌', '御船遊管絃祭'], answer: 'お水送り', explanation: '若狭の遠敷川から流した香水が、10日後に奈良の東大寺「お水取り」の若狭井に届くとされる、若狭と奈良を結ぶ歴史ある神事です。' },
            { id: 'f3', category: 'イベント', question: '毎年2月に勝山市で行われ、色鮮やかな短冊で飾られた櫓の上で浮かれるように太鼓を叩く奇祭は何でしょう？', options: ['勝山左義長まつり', '敦賀まつり', '三国祭', '放生祭'], answer: '勝山左義長まつり', explanation: '街の各所に立てられた櫓の上で、赤い長襦袢を着た大人や子供が三味線や笛に合わせて浮かれるように太鼓を叩く、奥越の春を呼ぶお祭りです。' },
            { id: 'f4', category: 'イベント', question: '毎年9月に開催され、氣比神宮の例大祭に合わせて山車が巡行する敦賀市のお祭りは何でしょう？', options: ['敦賀まつり', '三国祭', '総社大神宮大祭', 'フェニックスまつり'], answer: '敦賀まつり', explanation: '氣比神宮の例大祭に合わせて行われ、実物大の鎧兜を身につけた武者行列や勇壮な山車巡行が行われる敦賀最大のイベントです。' },
            { id: 'f5', category: 'イベント', question: '桜の名所・金崎宮で春に行われ、桜の小枝を交換することで想いを伝えるロマンチックなお祭りは何でしょう？', options: ['花換まつり', '桜まつり', '恋まつり', '縁結びまつり'], answer: '花換まつり', explanation: '明治時代、金崎宮を訪れた男女が「花換えましょう」と声を掛け合い、桜の小枝を交換して想いを伝えたというロマンチックな風習が起源です。' },
            { id: 'f6', category: 'イベント', question: '福井市で毎年8月に開催される、空襲や震災からの復興を願って始まった、花火大会などが目玉のイベントは何でしょう？', options: ['福井フェニックスまつり', 'おおの城まつり', 'あさひまつり', 'たけふ菊人形'], answer: '福井フェニックスまつり', explanation: '1945年の福井空襲、1948年の福井地震からの復興を願い、「不死鳥（フェニックス）」をシンボルに始まった福井市の夏の風物詩です。' },
            { id: 'f7', category: 'イベント', question: '越前町で毎年7月に開催される、福井県内で最も早く行われ、越前漁港を舞台に打ち上げられる花火大会は何でしょう？', options: ['越前みなと大花火', '三国花火大会', 'とうろう流しと大花火大会', '若狭マリンピア花火大会'], answer: '越前みなと大花火', explanation: '福井県内の夏花火のトップを切って開催されます。漁港を舞台に打ち上げられ、海面に映る花火や山に反響する音が迫力満点です。' },

        function shuffle(array) {
            let newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

            const nickInput = document.getElementById('nickname-input').value.trim();

                renderProfile();
                return;
            }
            
            currentUser = { nickname: nickInput, prefecture: prefInput };
            localStorage.setItem('fukui_quiz_user', JSON.stringify(currentUser));
            errorMsg = '';
            setMode('home');
        }

            if (!currentUser.nickname) return;
            
            const newRecord = {
                date: new Date().toISOString(),
                mode: quizConfig.title,
                score: score,
                total: quizConfig.count,
                percentage: Math.round((score / quizConfig.count) * 100),
                points: score * 10 
            };
            
            localScores.push(newRecord);
            localStorage.setItem('fukui_quiz_scores', JSON.stringify(localScores));

            if (modeStr === 'links') {
                document.getElementById('ad-top-wrapper').classList.add('hidden');

                loadAds(); // その他の画面では共通広告を表示

            if (modeStr === 'home') renderHome();
            else if (modeStr === 'category') renderCategory();
            else if (modeStr === 'quiz') renderQuiz();
            else if (modeStr === 'result') renderResult();
            else if (modeStr === 'profile') renderProfile();

            }

        function startQuiz(type, categoryName = null) {
            initAudio(); 
            
            let availableQuestions = QUIZ_DATA.filter(q => !usedQuestionIds.has(q.id));
            if (type === 'category') {
                availableQuestions = availableQuestions.filter(q => q.category === categoryName);
            }

            let requiredCount = 5;
            if (type === 'category') requiredCount = 4;
            if (type === 'hard') requiredCount = 10;

            if (availableQuestions.length < requiredCount) {
                errorMsg = `【警告】未挑戦の問題が不足しています。履歴をリセットして再挑戦してください。`;
                setMode('home');
                return;
            }

            const selected = shuffle(availableQuestions).slice(0, requiredCount);
            currentQuiz = selected.map(q => ({
                ...q,
                options: shuffle([...q.options])
            }));

            selected.forEach(q => usedQuestionIds.add(q.id));

            let title = '';
            if (type === 'hard') title = '【激ムズ】真の県民愛テスト';
            else if (type === 'random') title = '全ジャンル・ランダム5番勝負！';
            else title = `${categoryName}の難問に挑戦`;

            quizConfig = { title, count: requiredCount, type, category: categoryName };
            currentIndex = 0;
            score = 0;
            wrongAnswers = []; 
            selectedOption = null;
            isAnswered = false;
            errorMsg = '';
            
            setMode('quiz');
        }

        function handleAnswer(option) {
            if (isAnswered) return;
            selectedOption = option;
            isAnswered = true;
            
            const currentQ = currentQuiz[currentIndex];
            const isCorrect = (option === currentQ.answer);
            
            playSound(isCorrect ? 'correct' : 'wrong');
            showMark(isCorrect);
            
            if (isCorrect) {
                score++;
            } else {
                wrongAnswers.push({
                    question: currentQ.question,
                    answer: currentQ.answer,
                    explanation: currentQ.explanation
                });
            }
            renderQuiz();
        }

        function handleNext() {
            initAudio();
            if (currentIndex < currentQuiz.length - 1) {
                currentIndex++;
                selectedOption = null;
                isAnswered = false;
                renderQuiz();
            } else {
                saveScoreRecord(); 
                setMode('result');
            }
        }

                                <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-800 bg-slate-50 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 font-bold transition-all">

                                    <span id="btnText">送信する</span>
                                    <svg id="btnSpinner" class="animate-spin -mr-1 ml-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                </button>

                    </div>
                </div>
            </div>`;
            
            appRoot.innerHTML = html;

            const form = document.getElementById('contactForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const resultMessage = document.getElementById('resultMessage');

            // ⚠️ 【重要】ここにGASでデプロイしたWebアプリのURLを貼り付けます
            const GAS_WEB_APP_URL = 'ここにウェブアプリのURLを貼り付けてください';

            form.addEventListener('submit', async (e) => {
                e.preventDefault(); 

                if(GAS_WEB_APP_URL === 'ここにウェブアプリのURLを貼り付けてください') {
                    alert('GASのウェブアプリURLが設定されていません。コード（GAS_WEB_APP_URL）を修正してください。');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70', 'cursor-not-allowed', 'shadow-none', 'translate-y-[4px]', 'translate-x-[4px]');
                btnText.textContent = '送信中...';
                btnSpinner.classList.remove('hidden');
                resultMessage.classList.add('hidden');

                const formData = new FormData(form);
                const data = new URLSearchParams(formData);

                try {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: data,
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        }
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        form.reset(); 
                        resultMessage.innerHTML = '✅ お問い合わせを送信しました。<br>自動返信メールをご確認ください。';
                        resultMessage.className = 'mt-4 text-center font-bold text-emerald-800 bg-emerald-50 border-emerald-500 p-4 rounded-xl border-2';
                    } else {
                        throw new Error(result.message || '送信に失敗しました');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    resultMessage.textContent = '❌ エラーが発生しました。時間をおいて再度お試しください。';
                    resultMessage.className = 'mt-4 text-center font-bold text-red-800 bg-red-50 border-red-500 p-4 rounded-xl border-2';

                    btnText.textContent = '送信する';
                    btnSpinner.classList.add('hidden');
                    resultMessage.classList.remove('hidden');
                }
            });
        }
